# ──────────────────────────────────────────────────────────────────────────────
# REQNX — Distributed Rate Limiter Test Infrastructure
#
# Pinned Redis and Valkey engine versions for local development and CI testing.
# All ports bound exclusively to 127.0.0.1 for local isolation.
# ──────────────────────────────────────────────────────────────────────────────

services:
  # Primary / Documented Minimum: Redis 7.2 LTS
  redis-7-2:
    image: redis:7.2.7-alpine
    container_name: reqnx-redis-7-2
    ports:
      - '127.0.0.1:6379:6379'
    command: redis-server --appendonly no --save ""
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 2s
      retries: 5

  # Current Stable: Redis 7.4
  redis-7-4:
    image: redis:7.4.2-alpine
    container_name: reqnx-redis-7-4
    ports:
      - '127.0.0.1:6380:6379'
    command: redis-server --appendonly no --save ""
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 2s
      retries: 5

  # Long-Term Stable Fork: Valkey 7.2
  valkey-7-2:
    image: valkey/valkey:7.2.14-alpine
    container_name: reqnx-valkey-7-2
    ports:
      - '127.0.0.1:6381:6379'
    command: valkey-server --appendonly no --save ""
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 3s
      timeout: 2s
      retries: 5

  # Current Major: Valkey 8.0
  valkey-8-0:
    image: valkey/valkey:8.0.11-alpine
    container_name: reqnx-valkey-8-0
    ports:
      - '127.0.0.1:6382:6379'
    command: valkey-server --appendonly no --save ""
    healthcheck:
      test: ['CMD', 'valkey-cli', 'ping']
      interval: 3s
      timeout: 2s
      retries: 5
